<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý kho</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📦 Quản lý kho</h1>
    <div class="nguoidung">
      <span id="ten-nguoi-dung"></span>
      <button id="btn-dangxuat" class="xoa">Đăng xuất</button>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Thêm sản phẩm</h2>
      <form id="form-them">
        <input id="ten" placeholder="Tên sản phẩm" required>
        <input id="donvi" placeholder="Đơn vị (cái, hộp...)">
        <input id="vitri" placeholder="Vị trí (Kệ A1...)">
        <input id="soluong" type="number" min="0" placeholder="Số lượng ban đầu" value="0">
        <button type="submit">Thêm</button>
      </form>
    </section>

    <section class="card">
      <h2>Danh sách sản phẩm</h2>
      <input id="tim" class="tim" placeholder="🔍 Tìm theo tên...">
      <table>
        <thead>
          <tr><th>Mã</th><th>Tên</th><th>Đơn vị</th><th>Vị trí</th><th>Tồn kho</th><th>Thao tác</th></tr>
        </thead>
        <tbody id="ds-sanpham"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Lịch sử nhập / xuất</h2>
      <table>
        <thead>
          <tr><th>Thời gian</th><th>Sản phẩm</th><th>Loại</th><th>Số lượng</th><th>Ghi chú</th></tr>
        </thead>
        <tbody id="ds-giaodich"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
